<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>موتور سرویس ریمایندر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15161A;
    --bg-soft:radial-gradient(120% 140% at 50% -10%, #23262c 0%, #15161A 55%);
    --elev1:#1D1F24;
    --elev2:#25282F;
    --elev3:#2E323A;
    --border:#34373F;
    --border-soft:#2A2D34;
    --text:#F2EFE8;
    --text-dim:#A4A6AE;
    --text-dimmer:#71737C;
    --accent:#F0A63B;
    --accent-soft:#4A371A;
    --accent-ink:#1A1206;
    --good:#68C97F;
    --good-soft:#1C2B1F;
    --warn:#F2C64C;
    --warn-soft:#332C15;
    --bad:#E8615C;
    --bad-soft:#331A19;
    --r-sm:10px;
    --r-md:16px;
    --r-lg:24px;
    --shadow: 0 10px 30px -12px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-soft) var(--bg);
    color:var(--text);
    font-family:'Vazirmatn', sans-serif;
    min-height:100vh;
    direction:rtl;
    -webkit-font-smoothing:antialiased;
  }
  #shell{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  #main{
    flex:1;
    padding:18px 16px 100px;
    animation:fadein .45s ease both;
  }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){
    #main{animation:none;}
    *{transition:none !important;}
  }

  h1,h2,h3,p{margin:0;}
  button{font-family:inherit; border:none; cursor:pointer; background:none; color:inherit;}
  input, select{font-family:inherit; color:var(--text); background:var(--elev2); border:1px solid var(--border); border-radius:var(--r-sm); padding:12px 14px; font-size:15px; width:100%;}
  input:focus, select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  input[type=number]{direction:ltr; text-align:right; font-variant-numeric:tabular-nums;}
  input[type=date]{direction:ltr; text-align:right;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 16px 4px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:36px; height:36px; border-radius:11px;
    background:linear-gradient(155deg, var(--accent), #b96f1c);
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow);
    flex:none;
  }
  .brand-title{font-weight:800; font-size:15px; letter-spacing:0;}
  .brand-sub{font-size:11.5px; color:var(--text-dimmer); margin-top:1px;}

  .icon{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .icon-sm{width:15px; height:15px;}
  .icon-lg{width:26px; height:26px;}

  /* ---------- Hero odometer ---------- */
  .hero{
    background:linear-gradient(160deg, #23262C 0%, #191A1E 100%);
    border:1px solid var(--border-soft);
    border-radius:var(--r-lg);
    padding:22px 20px 18px;
    position:relative;
    overflow:hidden;
    box-shadow: var(--shadow);
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(115deg, rgba(240,166,59,.05) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  .hero-label{font-size:12.5px; color:var(--text-dim); font-weight:500;}
  .hero-num-row{display:flex; align-items:baseline; gap:8px; margin-top:6px;}
  .hero-num{
    font-size:46px; font-weight:800; letter-spacing:.5px;
    font-variant-numeric:tabular-nums; direction:ltr; display:inline-block;
    color:var(--text);
    text-shadow:0 0 22px rgba(240,166,59,.25);
  }
  .hero-unit{font-size:14px; color:var(--accent); font-weight:700; margin-bottom:6px;}
  .hero-vehicle{font-size:12.5px; color:var(--text-dimmer); margin-top:4px;}
  .hero-actions{display:flex; gap:8px; margin-top:14px; position:relative;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 16px; border-radius:var(--r-sm); font-size:14px; font-weight:600;
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-accent{background:var(--accent); color:var(--accent-ink);}
  .btn-ghost{background:var(--elev3); color:var(--text);}
  .btn-outline{background:transparent; border:1px solid var(--border); color:var(--text-dim);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 12px; font-size:13px; border-radius:9px;}
  .btn-danger{background:var(--bad-soft); color:var(--bad); border:1px solid rgba(232,97,92,.35);}
  .btn:disabled{opacity:.45; pointer-events:none;}

  /* ---------- Alert banner ---------- */
  .alert-banner{
    display:flex; align-items:center; gap:10px;
    background:var(--bad-soft); border:1px solid rgba(232,97,92,.3);
    border-radius:var(--r-md); padding:12px 14px; margin-top:14px;
  }
  .alert-banner.warn{background:var(--warn-soft); border-color:rgba(242,198,76,.3);}
  .alert-banner .icon{color:var(--bad); flex:none;}
  .alert-banner.warn .icon{color:var(--warn);}
  .alert-text b{font-weight:700;}
  .alert-text{font-size:13.5px; line-height:1.7; color:var(--text);}

  /* ---------- section ---------- */
  .section-title{
    font-size:13.5px; font-weight:700; color:var(--text-dim);
    margin:22px 2px 10px; display:flex; align-items:center; justify-content:space-between;
  }

  /* ---------- item card ---------- */
  .item-card{
    background:var(--elev1); border:1px solid var(--border-soft); border-radius:var(--r-md);
    padding:14px 14px 12px; margin-bottom:10px;
  }
  .item-top{display:flex; align-items:flex-start; gap:11px;}
  .item-icon{
    width:38px; height:38px; border-radius:11px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:var(--elev3); color:var(--text-dim);
  }
  .item-icon.st-ok{background:var(--good-soft); color:var(--good);}
  .item-icon.st-soon{background:var(--warn-soft); color:var(--warn);}
  .item-icon.st-overdue{background:var(--bad-soft); color:var(--bad);}
  .item-body{flex:1; min-width:0;}
  .item-name-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .item-name{font-size:14.5px; font-weight:700;}
  .badge{font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; flex:none;}
  .badge.st-ok{background:var(--good-soft); color:var(--good);}
  .badge.st-soon{background:var(--warn-soft); color:var(--warn);}
  .badge.st-overdue{background:var(--bad-soft); color:var(--bad);}
  .item-meta{font-size:12px; color:var(--text-dimmer); margin-top:3px; line-height:1.6;}

  .progress-wrap{margin-top:10px;}
  .progress-track{height:7px; border-radius:20px; background:var(--elev3); overflow:hidden;}
  .progress-fill{height:100%; border-radius:20px; transition:width .5s ease;}
  .progress-fill.st-ok{background:var(--good);}
  .progress-fill.st-soon{background:var(--warn);}
  .progress-fill.st-overdue{background:var(--bad);}
  .progress-label{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-dimmer); margin-top:6px;}

  .item-actions{display:flex; gap:8px; margin-top:12px;}
  .item-info-toggle{font-size:12px; color:var(--text-dimmer); margin-top:8px; text-decoration:none; display:inline-flex; align-items:center; gap:4px;}
  .item-info-box{font-size:12.5px; color:var(--text-dim); background:var(--elev2); border-radius:10px; padding:10px 11px; margin-top:8px; line-height:1.8; display:none;}
  .item-info-box.open{display:block;}

  .inline-form{margin-top:12px; padding-top:12px; border-top:1px dashed var(--border); display:none;}
  .inline-form.open{display:block;}
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
  .field-row{display:flex; gap:8px;}
  .field-row .field{flex:1;}

  /* ---------- bottom nav ---------- */
  #bottomnav{
    position:sticky; bottom:0; left:0; right:0;
    background:rgba(21,22,26,.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--border-soft);
    display:flex; max-width:460px; margin:0 auto; width:100%;
  }
  .navbtn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:11px 4px 12px; font-size:11px; color:var(--text-dimmer); font-weight:600;
  }
  .navbtn.active{color:var(--accent);}
  .navbtn .icon{stroke-width:1.9;}

  /* ---------- onboarding ---------- */
  .onb-wrap{padding-top:8px;}
  .onb-progress{display:flex; gap:6px; margin-bottom:22px;}
  .onb-dot{height:4px; flex:1; border-radius:4px; background:var(--elev3);}
  .onb-dot.done{background:var(--accent);}
  .onb-title{font-size:21px; font-weight:800; line-height:1.5;}
  .onb-sub{font-size:13.5px; color:var(--text-dim); margin-top:8px; line-height:1.8;}

  .vcard{
    display:flex; align-items:center; gap:12px;
    background:var(--elev1); border:1.5px solid var(--border-soft); border-radius:var(--r-md);
    padding:14px; margin-top:12px;
  }
  .vcard.selected{border-color:var(--accent); background:var(--elev2);}
  .vcard-icon{width:44px; height:44px; border-radius:12px; background:var(--elev3); display:flex; align-items:center; justify-content:center; flex:none; color:var(--accent);}
  .vcard-title{font-size:14.5px; font-weight:700;}
  .vcard-sub{font-size:12px; color:var(--text-dimmer); margin-top:3px; line-height:1.6;}
  .vcard-check{width:22px; height:22px; border-radius:50%; border:2px solid var(--border); flex:none;}
  .vcard.selected .vcard-check{border-color:var(--accent); background:var(--accent); position:relative;}

  .onb-item-row{
    background:var(--elev1); border:1px solid var(--border-soft); border-radius:var(--r-md);
    padding:12px 13px; margin-bottom:9px;
  }
  .onb-item-row .item-name{font-size:13.5px;}
  .onb-item-row input{margin-top:8px;}
  .onb-footer{display:flex; gap:8px; margin-top:20px;}

  .empty-state{
    text-align:center; padding:40px 20px; color:var(--text-dimmer);
  }
  .empty-state .icon-lg{margin-bottom:10px; color:var(--text-dimmer);}
  .empty-state p{font-size:13.5px; line-height:1.8;}

  /* history */
  .hist-row{
    display:flex; align-items:center; gap:12px;
    background:var(--elev1); border:1px solid var(--border-soft); border-radius:var(--r-md);
    padding:12px 13px; margin-bottom:8px;
  }
  .hist-icon{width:34px; height:34px; border-radius:10px; background:var(--good-soft); color:var(--good); display:flex; align-items:center; justify-content:center; flex:none;}
  .hist-title{font-size:13.5px; font-weight:700;}
  .hist-sub{font-size:11.5px; color:var(--text-dimmer); margin-top:2px;}

  /* dialog */
  .dialog-backdrop{
    position:fixed; inset:0; background:rgba(10,10,12,.6); backdrop-filter:blur(2px);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
    animation:fadein .18s ease both;
  }
  .dialog{
    width:100%; max-width:460px; background:var(--elev1); border:1px solid var(--border);
    border-radius:22px 22px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  }
  .dialog-title{font-size:16px; font-weight:800; margin-bottom:8px;}
  .dialog-text{font-size:13.5px; color:var(--text-dim); line-height:1.8; margin-bottom:16px;}
  .dialog-actions{display:flex; gap:8px;}

  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    background:var(--elev3); color:var(--text); border:1px solid var(--border);
    padding:10px 16px; border-radius:30px; font-size:13px; font-weight:600;
    z-index:60; box-shadow:var(--shadow);
    animation:toastin .25s ease both;
  }
  @keyframes toastin{ from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);} }

  .settings-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--elev1); border:1px solid var(--border-soft); border-radius:var(--r-md);
    padding:14px; margin-bottom:10px;
  }
  .settings-row-title{font-size:14px; font-weight:700;}
  .settings-row-sub{font-size:11.5px; color:var(--text-dimmer); margin-top:2px;}

  .note-box{
    background:var(--elev1); border:1px solid var(--border-soft); border-radius:var(--r-md);
    padding:14px; font-size:12.5px; color:var(--text-dim); line-height:1.9; margin-top:10px;
  }
  .note-box b{color:var(--text);}
  a.link{color:var(--accent); text-decoration:none;}
</style>
</head>
<body>
<div id="shell">
  <div id="main"></div>
  <div id="bottomnav" style="display:none"></div>
</div>

<script>
/* =========================================================
   موتور سرویس ریمایندر — Motor Service Reminder
   Single-file app. Data persists via window.storage when
   available (inside Claude), otherwise falls back to an
   in-memory store for the current session.
   ========================================================= */

/* ---------------- storage layer ----------------
   Priority:
   1) window.storage — available when this page runs inside a Claude
      artifact preview. Data is tied to that Claude environment.
   2) real localStorage — available when this file is opened directly
      in a normal mobile/desktop browser (or wrapped as an app via
      Capacitor / App Inventor / PWABuilder etc.). Persists on-device,
      no Claude or internet connection needed.
   3) in-memory object — last-resort fallback if both are blocked;
      data only survives for the current page view.
*/
const hasRealStorage = (typeof window.storage !== 'undefined');
function detectLocalStorage(){
  try{
    const t = '__msr_test__';
    localStorage.setItem(t,'1');
    localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
}
const useLocal = !hasRealStorage && detectLocalStorage();
const storageMode = hasRealStorage ? 'cloud' : (useLocal ? 'device' : 'temp');
let memStore = {};

async function storeGet(key){
  if(hasRealStorage){
    try{ return await window.storage.get(key, false); }catch(e){ return null; }
  }
  if(useLocal){
    try{
      const v = localStorage.getItem('msr_'+key);
      return (v!=null) ? {value:v} : null;
    }catch(e){ return null; }
  }
  return (key in memStore) ? {value: memStore[key]} : null;
}
async function storeSet(key, value){
  if(hasRealStorage){
    try{ await window.storage.set(key, value, false); return true; }
    catch(e){ console.error('storage set failed', e); return false; }
  }
  if(useLocal){
    try{ localStorage.setItem('msr_'+key, value); return true; }
    catch(e){ return false; }
  }
  memStore[key] = value; return true;
}
async function storeDelete(key){
  if(hasRealStorage){ try{ await window.storage.delete(key, false); }catch(e){} return; }
  if(useLocal){ try{ localStorage.removeItem('msr_'+key); }catch(e){} return; }
  delete memStore[key];
}

/* ---------------- utils ---------------- */
function uid(){ return 'x' + Math.random().toString(36).slice(2,10); }
function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }
function fmt(n){
  n = Math.round(n);
  const neg = n < 0; n = Math.abs(n);
  const s = n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg?'-':'') + s;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* Gregorian -> Jalali (public-domain conversion algorithm) */
function toJalali(gy, gm, gd){
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy;
  if (gy <= 1600){ jy = 0; gy -= 621; } else { jy = 979; gy -= 1600; }
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + (Math.floor((gy2+3)/4)) - (Math.floor((gy2+99)/100)) + (Math.floor((gy2+399)/400)) - 80 + gd + g_d_m[gm-1];
  jy += 33 * Math.floor(days/12053);
  days %= 12053;
  jy += 4 * Math.floor(days/1461);
  days %= 1461;
  if (days > 365){
    jy += Math.floor((days-1)/365);
    days = (days-1) % 365;
  }
  let jm, jd;
  if (days < 186){
    jm = 1 + Math.floor(days/31);
    jd = 1 + (days % 31);
  } else {
    jm = 7 + Math.floor((days-186)/30);
    jd = 1 + ((days-186) % 30);
  }
  return [jy, jm, jd];
}
const JMONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function formatJalali(isoDate){
  if(!isoDate) return '—';
  const d = new Date(isoDate + 'T00:00:00');
  if (isNaN(d.getTime())) return '—';
  const [jy,jm,jd] = toJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
  return `${jd} ${JMONTHS[jm-1]} ${jy}`;
}

/* ---------------- icons ---------------- */
const ICONS = {
  drop:'<path d="M12 3c3.6 4.2 6.2 7.6 6.2 10.8A6.2 6.2 0 1 1 5.8 13.8C5.8 10.6 8.4 7.2 12 3z"/>',
  gear:'<path d="M12 2.3l6.5 3.75v7.9L12 17.7l-6.5-3.75v-7.9L12 2.3z"/><circle cx="12" cy="10" r="2.6"/>',
  filter:'<path d="M4 4.5h16l-6.2 8v6.2l-3.6 2v-8.2L4 4.5z"/>',
  spark:'<path d="M13.2 2.2 4.4 13.8h5.9l-.9 8 9.2-11.9h-5.9l.5-7.7z"/>',
  belt:'<circle cx="7.2" cy="12" r="3.1"/><circle cx="16.8" cy="12" r="3.1"/><path d="M7.6 9.1c2.8-1.8 6-1.8 8.8 0M7.6 14.9c2.8 1.8 6 1.8 8.8 0"/>',
  roller:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.6"/><path d="M12 4v2.4M12 17.6V20M4 12h2.4M17.6 12H20"/>',
  injector:'<path d="M14.5 2.5l4.3 4.3-2 2M11 6l7 7-5.2 5.2-7-7L11 6z"/><path d="M4.5 20.5 8 17"/>',
  brake:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.2"/><path d="M12 4.2v3M20 12h-3M12 19.8v-3M4 12h3"/>',
  tire:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.8"/><path d="M12 4v2.6M12 17.4V20M4 12h2.6M17.4 12H20M6.5 6.5l1.8 1.8M15.7 15.7l1.8 1.8M17.5 6.5l-1.8 1.8M8.3 15.7l-1.8 1.8"/>',
  battery:'<rect x="3" y="7.5" width="15" height="9" rx="2"/><path d="M18 10.2v3.6"/><path d="M7 10.5v3M11 10.5v3"/>',
  bike:'<circle cx="6.2" cy="17" r="3.1"/><circle cx="17.8" cy="17" r="3.1"/><path d="M6.2 17 9.8 9h4l3 8M9.3 9h4.3M13.6 9l2.8 4.2M9.8 9 7.6 14"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 4.9L3 17.5l2.6 2.6 6.3-6.3a4 4 0 0 0 4.9-5.4l-2.7 2.7-2-2 2.6-2.8z"/>',
  calendar:'<rect x="3.2" y="5" width="17.6" height="15.5" rx="2.4"/><path d="M3.2 9.6h17.6M8 3.2v4M16 3.2v4"/>',
  clock:'<circle cx="12" cy="12" r="8"/><path d="M12 7.6V12l3 2"/>',
  odometer:'<path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15l3.2-4.2M4 15h1.6M18.4 15H20"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="M5 13l4 4 10-10"/>',

/* ---------------- state ---------------- */
let state = {
  screen: 'loading',
  profile: null,     // {vehicleKey, vehicleLabel, currentKm, dailyUsage, createdAt}
  items: [],
  history: [],
  onboarding: { step:1, vehicleKey:'', currentKm:0, itemsDraft:null, dailyUsage:20 },
  ui: { editKm:false, openService:null, openInfo:{}, tab:'dashboard', dialog:null, toast:null, addCustomOpen:false }
};

async function loadState(){
  const p = await storeGet('profile');
  const it = await storeGet('items');
  const h = await storeGet('history');
  if(p && p.value){
    state.profile = JSON.parse(p.value);
    state.items = it && it.value ? JSON.parse(it.value) : [];
    state.history = h && h.value ? JSON.parse(h.value) : [];
    state.screen = 'app';
    state.ui.tab = 'dashboard';
  } else {
    state.screen = 'onboarding';
  }
  render();
}

async function persist(){
  await storeSet('profile', JSON.stringify(state.profile));
  await storeSet('items', JSON.stringify(state.items));
  await storeSet('history', JSON.stringify(state.history));
}

/* ---------------- status computation ---------------- */
function computeStatus(item){
  const cur = state.profile.currentKm;
  const dailyUsage = state.profile.dailyUsage || 0;
  if(item.mode === 'km'){
    const used = cur - (item.lastKm ?? cur);
    const remaining = item.intervalKm - used;
    const percent = clamp((used/item.intervalKm)*100, 0, 999);
    let status = 'ok';
    if(remaining <= 0) status = 'overdue';
    else if(remaining <= Math.max(item.intervalKm*0.15, 100)) status = 'soon';
    const days = dailyUsage>0 ? Math.ceil(remaining/dailyUsage) : null;
    return {percent, remaining, status, days, isTime:false};
  } else {
    const lastDate = item.lastDate || todayISO();
    const daysUsed = Math.floor((Date.now() - new Date(lastDate+'T00:00:00').getTime())/86400000);
    const remaining = item.intervalDays - daysUsed;
    const percent = clamp((daysUsed/item.intervalDays)*100, 0, 999);
    let status = 'ok';
    if(remaining <= 0) status = 'overdue';
    else if(remaining <= Math.max(item.intervalDays*0.15, 20)) status = 'soon';
    return {percent, remaining, status, days:remaining, isTime:true};
  }
}
function statusLabel(s){
  return s==='overdue' ? 'دیرکرد داره' : s==='soon' ? 'به‌زودی' : 'مرتبه';
}

/* ---------------- render root ---------------- */
function render(){
  const main = document.getElementById('main');
  const nav = document.getElementById('bottomnav');
  if(state.screen === 'loading'){
    nav.style.display='none';
    main.innerHTML = `<div style="padding-top:120px; text-align:center; color:var(--text-dimmer); font-size:13px;">در حال بارگذاری…</div>`;
    return;
  }
  if(state.screen === 'onboarding'){
    nav.style.display='none';
    main.innerHTML = renderOnboarding();
    return;
  }
  nav.style.display='flex';
  nav.innerHTML = renderNav();
  if(state.ui.tab==='dashboard') main.innerHTML = renderTopbar() + renderDashboard();
  else if(state.ui.tab==='history') main.innerHTML = renderTopbar() + renderHistory();
  else main.innerHTML = renderTopbar() + renderSettings();

  renderDialogLayer();
}

      </div>

}

async function onbFinish(){
  const v = parseInt(document.getElementById('onbUsageInput').value,10);
  const dailyUsage = isNaN(v) ? 0 : v;
  const vk = state.onboarding.vehicleKey;
  state.profile = {
    vehicleKey: vk,
    vehicleLabel: VEHICLE_PRESETS[vk].label,
    currentKm: state.onboarding.currentKm,
    dailyUsage,
    createdAt: todayISO()
  };
  state.items = state.onboarding.itemsDraft || [];
  state.history = state.items.filter(it=>it.mode==='km' || it.lastDate).map(it=>({
    id: uid(), itemId: it.id, itemName: it.name,
    km: it.mode==='km' ? it.lastKm : null,
    date: it.lastDate, note:'راه‌اندازی اولیه'
  }));
  state.screen = 'app';
  state.ui.tab = 'dashboard';
  await persist();
  render();
}
function onbGoto(step){ state.onboarding.step = step; render(); }

/* ---------------- dashboard ---------------- */
function renderDashboard(){
  const items = state.items.map(it=>({it, s:computeStatus(it)}));
  const overdue = items.filter(x=>x.s.status==='overdue').length;
  const soon = items.filter(x=>x.s.status==='soon').length;

  let banner = '';
  if(overdue>0){
    banner = `<div class="alert-banner">${icon('bulb')}<div class="alert-text"><b>${overdue} مورد</b> از موعدشون گذشته و بهتره زودتر بهشون برسی.</div></div>`;
  } else if(soon>0){
    banner = `<div class="alert-banner warn">${icon('bulb')}<div class="alert-text"><b>${soon} مورد</b> به‌زودی وقت سرویسشونه.</div></div>`;
  }

  items.sort((a,b)=>{
    const pr = {overdue:0, soon:1, ok:2};
    if(pr[a.s.status]!==pr[b.s.status]) return pr[a.s.status]-pr[b.s.status];
    return a.s.remaining - b.s.remaining;
  });

  return `
    <div class="hero">
      <div class="hero-label">کارکرد فعلی</div>
      <div class="hero-num-row">
        <span class="hero-num">${fmt(state.profile.currentKm)}</span>
        <span class="hero-unit">کیلومتر</span>
      </div>
      <div class="hero-vehicle">${state.profile.vehicleLabel}${state.profile.dailyUsage>0 ? ' • میانگین '+fmt(state.profile.dailyUsage)+' کیلومتر در روز' : ''}</div>
      <div class="hero-actions">
        ${state.ui.editKm ? `
          <input type="number" inputmode="numeric" id="editKmInput" value="${state.profile.currentKm}" style="flex:1;">
          <button class="btn btn-accent" onclick="saveKm()">${icon('check','icon-sm')} ثبت</button>
          <button class="btn btn-ghost" onclick="toggleEditKm(false)">انصراف</button>
        ` : `
          <button class="btn btn-accent" onclick="toggleEditKm(true)">${icon('edit','icon-sm')} به‌روزرسانی کیلومتر</button>
        `}
      </div>
    </div>
    ${banner}
    <div class="section-title">قطعات و سرویس‌ها</div>
    ${items.length===0 ? `
      <div class="empty-state">
        ${icon('wrench','icon-lg')}
        <p>هنوز قطعه‌ای اضافه نکردی.<br>از پایین یکی اضافه کن.</p>
      </div>
    ` : items.map(x=>renderItemCard(x.it, x.s)).join('')}
    <button class="btn btn-outline btn-block" style="margin-top:6px;" onclick="toggleAddCustom(true)">
      ${icon('plus','icon-sm')} افزودن قطعه دیگه
    </button>
    ${state.ui.addCustomOpen ? renderAddCustomForm() : ''}
  `;
}

function renderItemCard(it, s){
  const infoOpen = !!state.ui.openInfo[it.id];
  const formOpen = state.ui.openService === it.id;
  let remText, subText;
  if(s.isTime){
    remText = s.remaining>0 ? `${fmt(s.remaining)} روز مونده` : `${fmt(Math.abs(s.remaining))} روز دیرکرد`;
    subText = `آخرین تعویض: ${formatJalali(it.lastDate)}`;
  } else {
    remText = s.remaining>0 ? `${fmt(s.remaining)} کیلومتر مونده` : `${fmt(Math.abs(s.remaining))} کیلومتر دیرکرد`;
    const daysPart = s.days!=null ? ` (~${fmt(Math.max(s.days,0))} روز دیگه)` : '';
    subText = `آخرین تعویض: ${fmt(it.lastKm)} کیلومتر — ${formatJalali(it.lastDate)}`;
    remText += daysPart;
  }
  const pct = clamp(s.percent,0,100);
  return `
  <div class="item-card">
    <div class="item-top">
      <div class="item-icon st-${s.status}">${icon(it.icon,'icon-lg')}</div>
      <div class="item-body">
        <div class="item-name-row">
          <div class="item-name">${it.name}</div>
          <div class="badge st-${s.status}">${statusLabel(s.status)}</div>
        </div>
        <div class="item-meta">${subText}</div>
        <div class="progress-wrap">
          <div class="progress-track"><div class="progress-fill st-${s.status}" style="width:${pct}%"></div></div>
          <div class="progress-label"><span>${Math.round(clamp(s.percent,0,999))}% از عمرش مصرف شده</span><span>${remText}</span></div>
        </div>
        ${it.info ? `
          <div class="item-info-toggle" onclick="toggleInfo('${it.id}')">${infoOpen? 'بستن توضیحات ▲' : 'توضیحات فنی ▼'}</div>
          <div class="item-info-box ${infoOpen?'open':''}">${it.info}</div>
        `:''}
        <div class="item-actions">
          <button class="btn btn-accent btn-sm" onclick="toggleService('${it.id}')">${icon('check','icon-sm')} ثبت سرویس جدید</button>
          ${it.custom? `<button class="btn btn-outline btn-sm" onclick="askDeleteItem('${it.id}')">${icon('trash','icon-sm')}</button>`:''}
        </div>
        <div class="inline-form ${formOpen?'open':''}">
          <div class="field-row">
            ${!s.isTime ? `
            <div class="field">
              <label>کیلومتر سرویس</label>
              <input type="number" inputmode="numeric" id="svcKm_${it.id}" value="${state.profile.currentKm}">
            </div>`:''}
            <div class="field">
              <label>تاریخ</label>
              <input type="date" id="svcDate_${it.id}" value="${todayISO()}">
            </div>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-accent btn-block" onclick="submitService('${it.id}')">ثبت شد</button>
            <button class="btn btn-ghost" onclick="toggleService('${it.id}')">بی‌خیال</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function toggleInfo(id){ state.ui.openInfo[id] = !state.ui.openInfo[id]; render(); }
function toggleService(id){ state.ui.openService = (state.ui.openService===id) ? null : id; render(); }
function toggleEditKm(v){ state.ui.editKm=v; render(); }
async function saveKm(){
  const v = parseInt(document.getElementById('editKmInput').value,10);
  if(!isNaN(v) && v>=0){
    state.profile.currentKm = v;
    state.ui.editKm=false;
    await persist();
    showToast('کیلومتر به‌روزرسانی شد');
  }
  render();
}
async function submitService(id){
  const it = state.items.find(x=>x.id===id);
  if(!it) return;
  const dateEl = document.getElementById('svcDate_'+id);
  const date = dateEl.value || todayISO();
  let km = null;
  if(it.mode==='km'){
    const kmEl = document.getElementById('svcKm_'+id);
    km = parseInt(kmEl.value,10);
    if(isNaN(km)) km = state.profile.currentKm;
    it.lastKm = km;
  }
  it.lastDate = date;
  state.history.unshift({id:uid(), itemId:it.id, itemName:it.name, km, date, note:''});
  state.ui.openService = null;
  await persist();
  showToast('سرویس ثبت شد ✓');
  render();
}

function toggleAddCustom(v){ state.ui.addCustomOpen=v; render(); }
function renderAddCustomForm(){
  return `
  <div class="item-card" style="margin-top:10px;">
    <div class="item-name" style="margin-bottom:10px;">قطعه جدید</div>
    <div class="field">
      <label>اسم قطعه</label>
      <input type="text" id="newItemName" placeholder="مثلاً روغن ترمز">
    </div>
    <div class="field">
      <label>بازه سرویس (کیلومتر)</label>
      <input type="number" inputmode="numeric" id="newItemInterval" placeholder="مثلاً 5000">
    </div>
    <div class="field">
      <label>آخرین سرویس در چه کیلومتری بوده</label>
      <input type="number" inputmode="numeric" id="newItemLastKm" value="${state.profile.currentKm}">
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-accent btn-block" onclick="submitCustomItem()">اضافه کن</button>
      <button class="btn btn-ghost" onclick="toggleAddCustom(false)">انصراف</button>
    </div>
  </div>`;
}
async function submitCustomItem(){
  const name = document.getElementById('newItemName').value.trim();
  const interval = parseInt(document.getElementById('newItemInterval').value,10);
  const lastKm = parseInt(document.getElementById('newItemLastKm').value,10);
  if(!name || isNaN(interval) || interval<=0){
    showToast('اسم و بازه سرویس رو درست وارد کن');
    render();
    return;
  }
  const it = mkItemKm(uid(), name, 'wrench', interval, '');
  it.custom = true;
  it.lastKm = isNaN(lastKm) ? state.profile.currentKm : lastKm;
  it.lastDate = todayISO();
  state.items.push(it);
  state.history.unshift({id:uid(), itemId:it.id, itemName:it.name, km:it.lastKm, date:it.lastDate, note:'قطعه جدید'});
  state.ui.addCustomOpen = false;
  await persist();
  showToast('قطعه اضافه شد ✓');
  render();
}

function askDeleteItem(id){
  const it = state.items.find(x=>x.id===id);
  state.ui.dialog = {
    title: 'حذف این قطعه؟',
    text: `«${it.name}» و تاریخچه سرویسش پاک می‌شه. مطمئنی؟`,
    onConfirm: 'confirmDeleteItem',
    payload: id
  };
  render();
}
async function confirmDeleteItem(id){
  state.items = state.items.filter(x=>x.id!==id);
  state.history = state.history.filter(x=>x.itemId!==id);
  state.ui.dialog = null;
  await persist();
  showToast('حذف شد');
  render();
}

/* ---------------- history ---------------- */
function renderHistory(){
  if(state.history.length===0){
    return `<div class="section-title">تاریخچه سرویس‌ها</div>
    <div class="empty-state">${icon('history','icon-lg')}<p>هنوز هیچ سرویسی ثبت نشده.</p></div>`;
  }
  const rows = [...state.history].sort((a,b)=> new Date(b.date) - new Date(a.date));
  return `
    <div class="section-title">تاریخچه سرویس‌ها</div>
    ${rows.map(h=>`
      <div class="hist-row">
        <div class="hist-icon">${icon('check','icon-sm')}</div>
        <div style="flex:1;">
          <div class="hist-title">${h.itemName}</div>
          <div class="hist-sub">${h.km!=null ? fmt(h.km)+' کیلومتر — ' : ''}${formatJalali(h.date)}${h.note?' • '+h.note:''}</div>
        </div>
      </div>
    `).join('')}
  `;
}

/* ---------------- settings ---------------- */
function renderSettings(){
  return `
    <div class="section-title">تنظیمات</div>
    <div class="settings-row">
      <div>
        <div class="settings-row-title">میانگین مسافت روزانه</div>
        <div class="settings-row-sub">برای تخمین «چند روز تا سرویس بعدی»</div>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="number" inputmode="numeric" id="settingsUsage" value="${state.profile.dailyUsage}" style="width:80px;">
        <button class="btn btn-accent btn-sm" onclick="saveUsage()">ذخیره</button>
      </div>
    </div>
    <div class="settings-row">
      <div>
        <div class="settings-row-title">کارکرد فعلی</div>
        <div class="settings-row-sub">${fmt(state.profile.currentKm)} کیلومتر</div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="setTab('dashboard'); toggleEditKm(true);">ویرایش</button>
    </div>
    <div class="settings-row">
      <div>
        <div class="settings-row-title">مدل موتور</div>
        <div class="settings-row-sub">${state.profile.vehicleLabel}</div>
      </div>
    </div>

    <div class="section-title">درباره داده‌ها</div>
    <div class="note-box">
      کویر موتور دفترچه رسمی دقیقی برای S2 150 منتشر نکرده، برای همین بازه‌های سرویس بالا از <b>تجربه مکانیک‌ها و مالکان</b> اسکوترهای طرح کلیک (که S2 150 هم فنی همون خانواده‌ست) جمع‌آوری شده. اگه مکانیک خودت عدد دیگه‌ای پیشنهاد داد، همیشه حرف اون رو ترجیح بده — هر قطعه رو می‌تونی با ثبت سرویس جدید، به‌روز نگه داری.
    </div>

    <div class="section-title">داده‌ها</div>
    <button class="btn btn-danger btn-block" onclick="askResetAll()">${icon('trash','icon-sm')} پاک کردن همه اطلاعات و شروع دوباره</button>
    <div class="note-box" style="margin-top:14px;">
      ${storageMode==='cloud'
        ? '<b>الان داخل Claude باز شده:</b> اطلاعاتت همین‌جا ذخیره می‌شه و هر بار از داخل Claude بازش کنی، سر جاشه.'
        : storageMode==='device'
          ? '<b>ذخیره روی همین دستگاه:</b> اطلاعاتت مستقیم توی حافظهٔ همین مرورگر/گوشی ذخیره می‌شه، بدون نیاز به Claude یا اینترنت. فقط اگه کش مرورگر رو پاک کنی یا با مرورگر دیگه‌ای بازش کنی، این اطلاعات دیده نمی‌شن — پس همیشه از همون مرورگر/آیکون روی صفحه اصلی بازش کن.'
          : '<b>ذخیره موقته:</b> مرورگرت اجازه ذخیرهٔ دائمی نمی‌ده، پس اطلاعات فقط تا وقتی این صفحه بازه می‌مونه.'}
    </div>
  `;
}
async function saveUsage(){
  const v = parseInt(document.getElementById('settingsUsage').value,10);
  state.profile.dailyUsage = isNaN(v) ? 0 : v;
  await persist();
  showToast('ذخیره شد');
  render();
}
function askResetAll(){
  state.ui.dialog = {
    title:'همه چیز پاک بشه؟',
    text:'موتور، کیلومتر، لیست قطعات و کل تاریخچه سرویس‌ها برای همیشه پاک می‌شن و باید از اول راه‌اندازی کنی.',
    onConfirm:'confirmResetAll'
  };
  render();
}
async function confirmResetAll(){
  await storeDelete('profile');
  await storeDelete('items');
  await storeDelete('history');
  state = {
    screen:'onboarding',
    profile:null, items:[], history:[],
    onboarding:{step:1, vehicleKey:'', currentKm:0, itemsDraft:null, dailyUsage:20},
    ui:{editKm:false, openService:null, openInfo:{}, tab:'dashboard', dialog:null, toast:null, addCustomOpen:false}
  };
  render();
}

/* ---------------- dialog & toast ---------------- */
function renderDialogLayer(){
  let host = document.getElementById('dialogHost');
  if(host) host.remove();
  if(!state.ui.dialog) return;
  const d = state.ui.dialog;
  const div = document.createElement('div');
  div.id = 'dialogHost';
  div.innerHTML = `
    <div class="dialog-backdrop" onclick="if(event.target===this) closeDialog()">
      <div class="dialog">
        <div class="dialog-title">${d.title}</div>
        <div class="dialog-text">${d.text}</div>
        <div class="dialog-actions">
          <button class="btn btn-ghost btn-block" onclick="closeDialog()">بی‌خیال</button>
          <button class="btn btn-danger btn-block" onclick="${d.onConfirm}('${d.payload??''}')">مطمئنم</button>
        </div>
      </div>
    </div>`;
  document.getElementById('shell').appendChild(div);
}
function closeDialog(){ state.ui.dialog=null; render(); }

let toastTimer=null;
function showToast(msg){
  let host = document.getElementById('toastHost');
  if(host) host.remove();
  const div = document.createElement('div');
  div.id='toastHost';
  div.innerHTML = `<div class="toast">${msg}</div>`;
  document.getElementById('shell').appendChild(div);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ const h=document.getElementById('toastHost'); if(h) h.remove(); }, 2200);
}

/* ---------------- init ---------------- */
loadState();
</script>
</body>
</html>
